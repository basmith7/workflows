name: Node CI

# Installs a Node repo's dependencies (npm ci, with the npm cache) and runs its checks.
# Called from a repo's ci.yml, which runs on pull requests and as the test job of its build.yml;
# see templates/. With docker-template set, it first runs this repo's
# templates/<docker-template>/check-drift, from the same commit as this workflow, on the caller.
on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner, as JSON (a label string or a list of labels)
        type: string
        default: '"ubuntu-latest"'
      node-version:
        description: Node version for actions/setup-node
        type: string
        default: "24"
      packages-read:
        description: Authenticate npm to GitHub Packages for @basmith7 packages (the caller grants packages read)
        type: boolean
        default: false
      prisma:
        description: Run prisma generate after installing
        type: boolean
        default: false
      docker-template:
        description: Shared Dockerfile template (e.g. next-prisma) the repo's copies must match; its check-drift runs before anything else. Empty skips
        type: string
        default: ""
      commands:
        description: Newline-separated commands to run; empty runs npm run lint, typecheck, test and build, each only if package.json has it
        type: string
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 30 # a hung test or build shouldn't burn the 6 h default on private-repo minutes
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Shared Docker template
        if: inputs.docker-template != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-workflows
          sparse-checkout: templates/${{ inputs.docker-template }}
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Docker template drift
        if: inputs.docker-template != ''
        env:
          TEMPLATE: ${{ inputs.docker-template }}
        run: .shared-workflows/templates/"$TEMPLATE"/check-drift .

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          registry-url: ${{ inputs.packages-read && 'https://npm.pkg.github.com' || '' }}
          scope: ${{ inputs.packages-read && '@basmith7' || '' }}

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ inputs.packages-read && secrets.GITHUB_TOKEN || '' }}

      - if: inputs.prisma
        run: npx prisma generate

      - name: Checks
        env:
          COMMANDS: ${{ inputs.commands }}
        run: |
          if [ -z "$COMMANDS" ]; then
            COMMANDS=$(node -e '
              const scripts = require("./package.json").scripts || {};
              for (const s of ["lint", "typecheck", "test", "build"]) if (scripts[s]) console.log("npm run " + s);
            ')
          fi
          while IFS= read -r cmd; do
            [ -n "${cmd// }" ] || continue
            echo "::group::$cmd"
            bash -eo pipefail -c "$cmd" || { echo "::endgroup::"; echo "::error::failed: $cmd"; exit 1; }
            echo "::endgroup::"
          done <<<"$COMMANDS"
