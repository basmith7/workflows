name: Build image

# Builds one Docker image from the calling repo and pushes it to ghcr.io/<owner>/<image>,
# with the OCI source/revision/version/created labels and a registry layer cache at :buildcache
# (a GitHub Actions cache is scoped to the triggering ref, so tag builds could never reuse it).
# Called from a repo's own workflow; see the README for the caller.
on:
  workflow_call:
    inputs:
      image:
        description: Image name under ghcr.io/<owner>/ (default the repo name)
        type: string
        default: ""
      context:
        description: Build context
        type: string
        default: "."
      file:
        description: Dockerfile, relative to the context
        type: string
        default: Dockerfile
      build-args:
        description: Newline-separated KEY=value build args
        type: string
        default: ""
      npm-token:
        description: Pass GITHUB_TOKEN as the npm_token build secret (for GitHub Packages npm installs)
        type: boolean
        default: false
      runs-on:
        description: Runner, as JSON (a label string or a list of labels)
        type: string
        default: '"ubuntu-latest"'
      tag-mode:
        description: "ref: tag :<ref name>; sha: tag :<commit sha>"
        type: string
        default: ref
      latest:
        description: Also tag :latest (turn off for test builds)
        type: boolean
        default: true
      buildx-driver-opts:
        description: Newline-separated buildx driver options (e.g. network=host)
        type: string
        default: ""
      timeout-minutes:
        description: Job timeout
        type: number
        default: 360
    secrets:
      build-secrets:
        description: Newline-separated id=value BuildKit secrets (RUN --mount=type=secret,id=<id>)
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name, tags and labels
        id: meta
        env:
          IMAGE: ${{ inputs.image || github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
          TAG_MODE: ${{ inputs.tag-mode }}
          LATEST: ${{ inputs.latest }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          case $TAG_MODE in
            ref) version=$REF_NAME ;;
            sha) version=$SHA ;;
            *) echo "::error::tag-mode must be ref or sha, got '$TAG_MODE'"; exit 1 ;;
          esac
          ref=$(echo "ghcr.io/$OWNER/$IMAGE" | tr '[:upper:]' '[:lower:]')
          {
            echo "image=$ref"
            echo "tags<<EOT"
            echo "$ref:$version"
            [ "$LATEST" = true ] && echo "$ref:latest"
            echo "EOT"
            echo "labels<<EOT"
            echo "org.opencontainers.image.source=$REPO_URL"
            echo "org.opencontainers.image.revision=$SHA"
            echo "org.opencontainers.image.version=$version"
            echo "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "EOT"
          } >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: ${{ inputs.buildx-driver-opts }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.file }}
          build-args: ${{ inputs.build-args }}
          secrets: |
            ${{ inputs.npm-token && format('npm_token={0}', secrets.GITHUB_TOKEN) || '' }}
            ${{ secrets.build-secrets }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max
