name: Test

# This repo's own checks (callers' workflows live alongside it but don't run here).
on:
  pull_request:
    paths: ["templates/**", "tests/**", ".github/workflows/test.yml"]

permissions:
  contents: read

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck templates/next-prisma/check-drift templates/next-prisma/docker-entrypoint.sh tests/*.sh
      - run: bash tests/check-drift.test.sh
