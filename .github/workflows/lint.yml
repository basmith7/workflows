name: Lint

# actionlint over this repo's workflows and the caller templates. The templates are linted as an
# app holds them (in a git repo's .github/workflows), so build.yml's call to ./ci.yml resolves.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
          app=$(mktemp -d)
          chmod 755 "$app" # the actionlint image runs as an unprivileged user; mktemp makes it 0700
          mkdir -p "$app/.github/workflows"
          cp templates/*.yml "$app/.github/workflows/"
          git -C "$app" init -q
          docker run --rm -v "$app:/repo" -w /repo rhysd/actionlint:1.7.12 -color
